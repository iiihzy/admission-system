server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/admission_system?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      connection-test-query: SELECT 1

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: null
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.admission.entity
# JWT配置
jwt:
  secret: CM3Mvs2kUB4b8hfcw7TPpEDlY50yvKeQq8ZOhE5exjwkizWK4HNV4uKtQEbLAEgI0BPvhZV7mBi3xuLSyDv2aQ==
  expiration: 86400000  # 24小时

# 日志配置
logging:
  level:
    com.admission: debug
    org.springframework: warn